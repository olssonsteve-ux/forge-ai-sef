[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-ai-sef"
version = "0.2.1"
description = "Forge AI Software Engineering Framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
forge = "forge.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["forge*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-ai-sef"
version = "1.0.0rc1"
description = "Forge AI Software Engineering Framework"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = ["Development Status :: 4 - Beta"]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff==0.15.20",
]

[project.scripts]
forge = "forge.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["forge*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
